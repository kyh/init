name: Desktop release

# The app's shell packed for macOS and Windows, unsigned, kept as artifacts: on a published release
# and by hand (`gh workflow run desktop-release.yml --ref <branch>`), never on a push or a PR, since
# a macOS runner bills about ten times a Linux one and a Windows runner twice. A signed, notarized
# release is packed where its Developer ID is (apps/web/content/docs/launch/deployment.mdx).
on:
  release:
    types: [published]
  workflow_dispatch:

# a release's pack always finishes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (zip)
            os: macos-latest
            target: --mac zip
            artifacts: apps/desktop/.output/bin/*.zip
          - name: Windows (NSIS)
            os: windows-latest
            target: --win
            artifacts: apps/desktop/.output/bin/*.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true

      - name: Test
        working-directory: apps/desktop
        run: pnpm test

      - name: Pack
        working-directory: apps/desktop
        run: pnpm build && pnpm exec electron-builder ${{ matrix.target }} --publish never

      - name: Keep the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: init-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
