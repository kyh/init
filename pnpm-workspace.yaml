packages:
  - apps/*
  - packages/*

catalog:
  "@base-ui/react": ^1.7.0
  "@better-auth/expo": ^1.7.2
  "@better-auth/stripe": ^1.7.2
  "@kyh/tsconfig": ^1.2.0
  "@orpc/client": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.102.8
  "@tanstack/react-table": ^9.2.4
  "@types/node": ^26.4.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.1
  better-auth: ^1.7.2
  drizzle-orm: ^0.45.2
  lucide-react: ^1.37.0
  next: ^16.3.3
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  tsx: ^4.23.13
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: ^8.2.2
  zod: ^4.5.4

catalogs:
  # Expo must hold an SDK-blessed React, which may diverge from web's. Pinning it in a
  # NAMED catalog keeps that constraint explicit and separately bumpable, instead of an
  # unexplained version literal in apps/mobile/package.json that looks like drift.
  # Bump only alongside an Expo SDK upgrade.
  expo:
    react: 19.2.3
    react-dom: 19.2.3
    typescript: ~6.0.3

linkWorkspacePackages: true

allowBuilds:
  "@tailwindcss/oxide": true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  spawn-sync: true
  supabase: true

overrides:
  "@expo/dom-webview": "57.0.1"
  lightningcss: "1.30.1"
