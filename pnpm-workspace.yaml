packages:
  - apps/*
  - packages/*

catalog:
  "@base-ui/react": ^1.7.0
  "@better-auth/expo": ^1.7.1
  "@better-auth/stripe": ^1.7.1
  "@kyh/tsconfig": ^1.2.0
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.102.2
  "@tanstack/react-table": ^9.1.2
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.0
  better-auth: ^1.7.1
  drizzle-orm: ^0.45.2
  lucide-react: ^1.33.0
  next: ^16.3.2
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  superjson: ^2.2.6
  tailwindcss: ^4.3.3
  tsx: ^4.23.12
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: ^8.2.2
  zod: ^4.4.3

catalogs:
  # Expo must hold an SDK-blessed React, which may diverge from web's. Pinning it in a
  # NAMED catalog keeps that constraint explicit and separately bumpable, instead of an
  # unexplained version literal in apps/mobile/package.json that looks like drift.
  # Bump only alongside an Expo SDK upgrade.
  expo:
    react: 19.2.3
    react-dom: 19.2.3
    typescript: ~6.0.3

linkWorkspacePackages: true
