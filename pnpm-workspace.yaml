packages:
  - apps/*
  - packages/*

catalog:
  "@base-ui/react": ^1.9.0
  "@better-auth/drizzle-adapter": ^1.7.28
  "@better-auth/expo": ^1.7.28
  "@better-auth/stripe": ^1.7.28
  "@kyh/tsconfig": ^1.3.0
  "@orpc/client": 2.0.0-beta.53
  "@orpc/contract": 2.0.0-beta.53
  "@orpc/openapi": 2.0.0-beta.53
  "@orpc/server": 2.0.0-beta.53
  "@orpc/tanstack-query": 2.0.0-beta.53
  "@orpc/zod": 2.0.0-beta.53
  "@tailwindcss/postcss": ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.108.4
  "@tanstack/react-table": ^9.3.1
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  better-auth: ^1.7.28
  cn: ^0.5.2
  drizzle-orm: 1.0.0-rc.6
  lucide-react: ^1.78.0
  next: ^16.4.6
  next-themes: ^0.4.6
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  tsx: ^4.23.15
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: ^8.3.8
  zod: ^4.6.7

catalogs:
  # Expo must hold an SDK-blessed React, which may diverge from web's. Pinning it in a
  # NAMED catalog keeps that constraint explicit and separately bumpable, instead of an
  # unexplained version literal in apps/mobile/package.json that looks like drift.
  # Bump only alongside an Expo SDK upgrade.
  expo:
    "@types/react": ~19.3.0
    react: 19.3.0
    react-dom: 19.3.0
    typescript: ~6.0.3

linkWorkspacePackages: true

# The Expo SDK pins these; `pnpm up --latest` would move them past it. Bump them
# with `npx expo install --fix` during an SDK upgrade. Matching is by name only,
# so the `expo` catalog's names shared with web cannot be listed here.
update:
  ignoreDeps:
    - expo
    - expo-*
    - "@expo/*"
    - react-native
    - react-native-*
    - "@react-native/*"
    - nativewind

allowBuilds:
  "@tailwindcss/oxide": true
  electron-winstaller: false
  esbuild: true
  sharp: true
  spawn-sync: true

overrides:
  lightningcss: "1.30.1"

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.28"
  - "@better-auth/drizzle-adapter@1.7.28"
  - "@better-auth/expo@1.7.28"
  - "@better-auth/kysely-adapter@1.7.28"
  - "@better-auth/memory-adapter@1.7.28"
  - "@better-auth/mongo-adapter@1.7.28"
  - "@better-auth/prisma-adapter@1.7.28"
  - "@better-auth/stripe@1.7.28"
  - "@better-auth/telemetry@1.7.28"
  - better-auth@1.7.28
